<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard</title>
<!--
  DASHBOARD PADRÃO FORTRAFFIC v1.2 (logo Fortraffic na barra lateral + página Debriefing em todo lançamento, com comparativo entre lançamentos)
  ------------------------------------------------------------------
  Arquivo ÚNICO e FIXO. Não é editado por cliente: tudo que muda vem de JSON.
    launches.json        lista de lançamentos (seletor no topo)
    data-<id>.json       dados de cada lançamento (contrato em references/data-contract.md)
  Cor, logo (letra), moeda, idioma e páginas ligadas vêm de meta/config no JSON.
  Para mudar o visual do padrão, edite ESTE arquivo uma vez e republique em todos os clientes.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#252F26;--sb:#0d1320;--sb2:#18202f;--sbtx:#9aa4b8;
  --bg:#f4f5f8;--card:#fff;--card2:#f8f9fb;--bd:#e6e8ee;--tx:#14151e;--mut:#6b6f85;
  --good:#0f9d6b;--mid:#d98e04;--bad:#dc2626;--blue:#3b82f6;--orange:#f97316;--green:#10a37f;
  --hot:#e05a8a;--cold:#3b82f6;--ideal:#0f9d6b;--bom:#3b82f6;--desc:#dc2626;
  --r:10px;--fs:14px;--atx:#fff;--lgtx:#252F26;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
body.dark{--bg:#0e0e12;--card:#16171f;--card2:#1c1d28;--bd:#2a2b3d;--tx:#f0f0f8;--mut:#8b8fa8;--good:#00e5a0;--mid:#f5a623;--bad:#fc8181;--ideal:#00e5a0;--desc:#fc8181}
html{font-size:var(--fs)}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.5}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
#app{display:flex;min-height:100vh}

/* ── sidebar ── */
.sb{width:210px;flex:none;background:var(--sb);color:var(--sbtx);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-ft{padding:16px 16px 4px}
.sb-ft svg{height:20px;width:auto;display:block}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid #1d2638}
.sb-logo{width:36px;height:36px;border-radius:9px;background:#fff;color:var(--lgtx);font-weight:800;display:grid;place-items:center;font-size:.95rem;flex:none}
.sb-name{color:#fff;font-weight:700;font-size:.9rem;line-height:1.15}
.sb-sub{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#6b7690}
.sb nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:.86rem;font-weight:500;border:0;background:none;text-align:left;color:var(--sbtx)}
.nav-i:hover{background:var(--sb2);color:#fff}
.nav-i.on{background:var(--sb2);color:#fff;font-weight:700}
.nav-i .ic{width:16px;text-align:center;opacity:.8}
.sb-foot{padding:14px 16px;border-top:1px solid #1d2638}
.sb-launch{background:var(--sb2);border:1px solid #232d42;border-radius:9px;padding:9px 12px;margin-bottom:8px}
.sb-launch span{display:block;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:#6b7690}
.sb-launch b{color:#fff;font-size:.8rem;font-family:var(--mono);word-break:break-all}
.sb-upd{font-size:.68rem;color:#566079}

/* ── topo ── */
.mw{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 22px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:50}
.top-l,.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:1.05rem;font-weight:700}
.pill{font-size:.68rem;border:1px solid var(--bd);border-radius:20px;padding:3px 10px;background:var(--card2);color:var(--mut);white-space:nowrap}
.fs{display:flex;align-items:center;gap:6px;font-size:.68rem;color:var(--mut)}
.fs input{width:60px;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--card2)}
.seg button{background:none;border:0;padding:5px 11px;font-size:.74rem;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd)}
.seg.dk button.on{background:var(--accent);color:var(--atx);box-shadow:none}
.dt{display:flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:8px;padding:2px 8px;background:var(--card2);font-size:.72rem;color:var(--mut)}
.dt input{border:0;background:none;font-size:.72rem;width:104px;color:var(--tx)}
.dt button{border:0;background:none;cursor:pointer;color:var(--mut)}
.launchbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 22px;background:var(--card2);border-bottom:1px solid var(--bd)}
.launchbar .lbl{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.lb{background:none;border:1px solid var(--bd);border-radius:20px;padding:4px 13px;font-size:.74rem;font-weight:600;color:var(--mut);cursor:pointer}
.lb:hover{color:var(--tx)}
.lb.on{background:var(--accent);border-color:var(--accent);color:var(--atx)}
.lb .live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ef4444;margin-right:6px;vertical-align:middle}
.lb.on .live{background:var(--atx)}
main{padding:18px 22px 40px;max-width:1500px;width:100%;margin:0 auto}

body.dark .seg.dk button.on,body.dark .lb.on,body.dark .pl.on,body.dark .pg button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
body.dark .lb.on .live{background:var(--bg)}

/* ── blocos ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--k,var(--tx));border-radius:var(--r);padding:13px 16px}
.kpi .l{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.kpi .v{font-size:1.5rem;font-weight:800;font-family:var(--mono);color:var(--kc,var(--tx));letter-spacing:-.02em;line-height:1.1}
.kpi .s{font-size:.68rem;color:var(--mut);margin-top:3px}
.kpi.good{--k:var(--good);--kc:var(--good)}.kpi.mid{--k:var(--mid);--kc:var(--mid)}.kpi.bad{--k:var(--bad);--kc:var(--bad)}
.kpi.dark{--k:var(--tx)}.kpi.green{--k:var(--good);--kc:var(--good)}.kpi.orange{--k:var(--orange);--kc:var(--orange)}.kpi.blue{--k:var(--blue);--kc:var(--blue)}
.kpi.ideal{--k:var(--ideal);--kc:var(--ideal)}.kpi.bomk{--k:var(--bom);--kc:var(--bom)}.kpi.desck{--k:var(--desc);--kc:var(--desc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.card h2{font-size:.9rem;font-weight:700;margin-bottom:2px}
.card .sub{font-size:.72rem;color:var(--mut);margin-bottom:12px}
.card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:2.2fr 1fr;gap:14px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2 .card,.grid2e .card,.grid3 .card{margin-bottom:14px}
.ch{position:relative;height:260px}
.ch.sm{height:200px}.ch.lg{height:300px}
.empty{padding:26px;text-align:center;color:var(--mut);font-size:.82rem}
.sect{font-size:.95rem;font-weight:700;margin:20px 0 10px}

/* funil */
.fn{display:flex;flex-direction:column;gap:2px}
.fb{height:34px;border-radius:7px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff;font-weight:700;font-size:.82rem;min-width:130px}
.fr{display:flex;align-items:center;gap:8px;padding:3px 2px 3px 6px;font-size:.72rem}
.rate{border-radius:20px;padding:2px 10px;font-weight:600;border:1px solid}
.rate.good{background:#e7f6ef;color:#0b7a53;border-color:#bfe6d4}
.rate.mid{background:#fdf3dc;color:#9a6a00;border-color:#f2dc9e}
.rate.bad{background:#fdeaea;color:#b91c1c;border-color:#f6c4c4}
body.dark .rate.good{background:#06261c;color:#00e5a0;border-color:#0b4a37}
body.dark .rate.mid{background:#2e2205;color:#f5c04a;border-color:#5a4410}
body.dark .rate.bad{background:#2a1010;color:#fc8181;border-color:#5a2020}
.fconv{margin-top:6px;border:1px solid #f6c4c4;background:#fdeaea;border-radius:8px;padding:7px 12px;font-size:.78rem;color:var(--mut);display:flex;gap:8px;align-items:center}
.fconv b{font-size:.95rem}
.fconv.good{background:#e7f6ef;border-color:#bfe6d4}.fconv.mid{background:#fdf3dc;border-color:#f2dc9e}
body.dark .fconv{background:#2a1010;border-color:#5a2020}
body.dark .fconv.good{background:#06261c;border-color:#0b4a37}body.dark .fconv.mid{background:#2e2205;border-color:#5a4410}

/* tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.76rem}
th{text-align:left;font-size:.6rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;background:var(--card2)}
td{padding:6px 8px;border-bottom:1px solid var(--bd);font-family:var(--mono);white-space:nowrap}
td.t,th.t{font-family:var(--font);text-align:left;white-space:normal;word-break:break-word}
td.n,th.n{text-align:right}
td.c,th.c{text-align:center}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--card2)}
tr.tot td{font-weight:800;background:var(--card2);border-top:2px solid var(--bd)}
tr.sub td{background:var(--card2);font-size:.72rem}
tr.sub td:first-child{padding-left:26px}
tr.cp{cursor:pointer}
.good{color:var(--good)}.mid{color:var(--mid)}.bad{color:var(--bad)}.mut{color:var(--mut)}
td.good,td.mid,td.bad{font-weight:700}
.tag{display:inline-block;font-size:.55rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:5px;margin-left:6px;font-family:var(--font)}
.tag.up{background:#fdf0e1;color:#b45309}.tag.pgo{background:#e7f6ef;color:#0b7a53}.tag.org{background:#eef0f5;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa0b4;margin-right:8px}
.dot.on{background:#16a34a}
.note{font-size:.66rem;color:var(--mut);margin-top:8px}
.sck{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sck .box{border:1px solid var(--bd);border-radius:9px;padding:12px 14px;overflow:hidden}
.sck .box h3{font-size:.75rem;font-family:var(--mono);margin-bottom:8px}

/* dropdowns / filtros */
.dd{position:relative;display:inline-block}
.dd>summary{list-style:none;cursor:pointer;border:1px solid var(--bd);border-radius:8px;padding:5px 12px;font-size:.76rem;font-weight:600;background:var(--card)}
.dd>summary::-webkit-details-marker{display:none}
.dd .pn{position:absolute;z-index:40;top:110%;left:0;min-width:300px;max-height:320px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.dd label{display:flex;gap:8px;align-items:flex-start;font-size:.72rem;padding:4px 6px;border-radius:6px;cursor:pointer;word-break:break-all}
.dd label:hover{background:var(--card2)}
.sel{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;background:var(--card);font-size:.78rem;min-width:220px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pl{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:5px 16px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--tx)}
.pl.on{background:var(--accent);border-color:var(--accent);color:var(--atx)}

/* criativos */
.cr{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.cc{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.cc .th{aspect-ratio:9/16;max-height:290px;width:100%;background:var(--card2) center/cover no-repeat;display:grid;place-items:center;color:var(--mut);font-size:.7rem;position:relative}
.cc .th a{position:absolute;inset:0}
.cc .bd{padding:9px 10px;font-size:.66rem}
.cc .nm{font-weight:700;font-size:.72rem;word-break:break-all;margin-bottom:2px}
.cc .ct{color:var(--mut);font-size:.6rem;word-break:break-all;margin-bottom:6px}
.cc .st{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.cc .st span{display:block;font-size:.52rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.cc .st b{font-family:var(--mono);font-size:.78rem}

/* métricas diárias */
.mc{display:grid;grid-template-columns:130px 1fr;padding:0;overflow:hidden}
.mc .pv{display:flex;flex-direction:column;justify-content:center;align-items:center;border-right:1px solid var(--bd);background:var(--card2);padding:10px}
.mc .pv span{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.mc .pv b{font-size:1.3rem;font-family:var(--mono)}
.mc .bdy{padding:12px 16px}
.mc h3{font-size:.8rem;margin-bottom:4px}

/* lead scoring */
.sc-exp-intro{font-size:.84rem;color:var(--mut);line-height:1.6;margin-bottom:14px}
.sc-exp-intro strong{color:var(--tx)}
.sc-g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sc-i{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.sc-i.pri{border-color:var(--mid)}
.sc-i .nm{font-size:.74rem;font-weight:700}
.sc-i .mx{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.sc-i.pri .mx{color:var(--mid)}
.sc-r{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;color:var(--mut);padding:3px 0;border-bottom:1px dashed var(--bd)}
.sc-r:last-child{border-bottom:0}.sc-r b{color:var(--tx);white-space:nowrap}
.sc-lv{display:flex;gap:8px;flex-wrap:wrap}
.sc-l{flex:1;min-width:200px;font-size:.78rem;color:var(--mut);background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
.sc-l b{display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.sc-l.Ideal b{color:var(--ideal)}.sc-l.Bom b{color:var(--bom)}.sc-l.Descarte b{color:var(--desc)}.sc-l.Sem b{color:var(--mut)}
.ub{margin-bottom:10px}.ub .nm{font-size:.62rem;font-family:var(--mono);color:var(--mut);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ub .row{display:flex;align-items:center;gap:6px}
.ub .tr{flex:1;background:var(--card2);border-radius:3px;height:7px;overflow:hidden;display:flex}
.ub .tr i{height:7px;display:block}
.ub .cn{display:flex;gap:6px;font-size:.7rem;font-weight:700;min-width:74px;justify-content:flex-end;font-family:var(--mono)}
.leg{display:flex;gap:12px;margin-bottom:10px;font-size:.66rem;color:var(--mut)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fbt{background:var(--card2);border:1px solid var(--bd);border-radius:20px;padding:4px 13px;font-size:.72rem;font-weight:600;color:var(--mut);cursor:pointer}
.fbt.on{border-color:var(--accent);color:var(--tx);background:var(--card)}
.srch{background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;flex:1;min-width:160px;font-size:.78rem;outline:0}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.7rem;color:var(--mut)}
.pg .b{display:flex;gap:4px}.pg button{background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:2px 9px;cursor:pointer;font-size:.7rem}
.pg button.on{background:var(--accent);color:var(--atx);border-color:var(--accent)}
.ctag{font-size:.6rem;font-weight:800;padding:2px 8px;border-radius:20px;font-family:var(--font)}
.ctag.COLD{background:#e3eefe;color:#1d4ed8}.ctag.HOT{background:#fde7ef;color:#be185d}.ctag.OUTRO{background:#eef0f5;color:var(--mut)}
.cn1{font-weight:800;text-align:center}.cn1.i{color:var(--ideal)}.cn1.b{color:var(--bom)}.cn1.d{color:var(--desc)}.cn1.z{color:var(--bd)}

/* pesquisa */
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.qc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.qc h3{font-size:.78rem;font-weight:600;min-height:2.6em;margin-bottom:8px}
.qc .ch{height:170px}
.ql{margin-top:8px;font-size:.68rem}
.ql div{display:flex;gap:6px;align-items:center;padding:1px 0}
.ql i{width:8px;height:8px;border-radius:50%;flex:none}
.ql span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ql b{font-family:var(--mono)}

.ins{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 18px;font-size:.84rem;line-height:1.75;color:var(--mut)}
.ins strong{color:var(--tx)}
.load{display:grid;place-items:center;height:50vh;color:var(--mut);font-size:.85rem}
.tg{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);white-space:nowrap}
.tg.hot{color:#d6336c;border-color:#f3c2d4}.tg.cold{color:var(--blue);border-color:#c6dcf7}.tg.org{color:var(--good);border-color:#bfe6d4}.tg.no{color:var(--bad);border-color:#f6c4c4}
body.dark .tg.hot{border-color:#5a2038}body.dark .tg.cold{border-color:#1a3a60}body.dark .tg.org{border-color:#0b4a37}body.dark .tg.no{border-color:#5a2020}
tr.ne td{background:rgba(220,38,38,.07)}
tr.lk{cursor:pointer}tr.lk:hover td{background:var(--card2)}tr.cur td{font-weight:800}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:.78rem}.ph .nm{min-width:160px}.ph .tr{flex:1;background:var(--card2);border-radius:3px;height:8px;overflow:hidden}.ph .tr i{display:block;height:8px;background:var(--orange)}.ph b{min-width:130px;text-align:right;font-family:var(--mono)}
@media(max-width:560px){.ph{flex-wrap:wrap}.ph .nm{min-width:0;width:100%}}

@media(max-width:1000px){.grid2,.grid2e,.grid3,.sck{grid-template-columns:1fr}.sc-g{grid-template-columns:1fr 1fr}}
@media(max-width:820px){
  #app{flex-direction:column}
  .sb{width:100%;height:auto;position:static}
  .sb nav{flex-direction:row;overflow-x:auto;padding:6px 10px}
  .sb-foot{display:none}
  .top{position:static;padding:10px 14px}
  main{padding:14px}
  .mc{grid-template-columns:1fr}.mc .pv{border-right:0;border-bottom:1px solid var(--bd);flex-direction:row;gap:10px}
}
@media(max-width:560px){.sc-g{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <aside class="sb">
    <div class="sb-ft"><svg viewBox="0 0 220 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fortraffic">
      <text y="28" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="30" letter-spacing="-1"><tspan fill="#ffffff">FOR</tspan><tspan fill="#00c98a">TR</tspan><tspan fill="#00d494">A</tspan><tspan fill="#00de9d">F</tspan><tspan fill="#00e5a0">FIC</tspan></text>
    </svg></div>
    <div class="sb-brand"><div class="sb-logo" id="sbLogo">FT</div><div><div class="sb-name" id="sbName">Dashboard</div><div class="sb-sub" id="sbSub"></div></div></div>
    <nav id="nav"></nav>
    <div class="sb-foot"><div class="sb-launch"><span id="sbLl"></span><b id="sbLaunch">—</b></div><div class="sb-upd" id="sbUpd"></div></div>
  </aside>
  <div class="mw">
    <header class="top">
      <div class="top-l"><h1 id="pgTitle"></h1><span class="pill" id="pillUp"></span><label class="fs">Aa <input type="range" id="fsz" min="12" max="17" value="14"></label></div>
      <div class="top-r" id="filters"></div>
    </header>
    <div class="launchbar" id="launchbar"></div>
    <main id="page"><div class="load">…</div></main>
  </div>
</div>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   NÚCLEO: estado, formatação, filtros, agregações
   ════════════════════════════════════════════════════════════════════ */
var D=null, DB=null, DBC={}, LAUNCHES=[], CH=[], POST=[];
var S={launch:null,page:null,lang:'pt',theme:'light',per:'all',from:'',to:'',onlyL:true,paid:false,camps:null,labels:true,gran:'d'};

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function t(k){var d=I18N[S.lang]||I18N.pt;if(d[k]==null){console.warn('i18n faltando: '+k);return k}return d[k]}

/* ── formatação ── */
var cur=function(){return (D&&D.meta&&D.meta.moeda)||'$'};
var nf=function(v,d){return Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})};
var ok=function(v){return v!=null&&isFinite(v)};
var money=function(v){return ok(v)?cur()+nf(v,2):'—'};
var num=function(v){return ok(v)?nf(v,0):'—'};
var pct=function(v,d){return ok(v)?nf(v,d==null?2:d)+'%':'—'};
var xf=function(v){return ok(v)?nf(v,2)+'x':'—'};
var div=function(a,b){return b>0?a/b:null};
var pc=function(a,b){return b>0?a/b*100:null};
var sum=function(rows,f){var s=0;for(var i=0;i<rows.length;i++)s+=(+rows[i][f]||0);return s};

/* ── datas (sempre ISO yyyy-mm-dd; nunca fatiar string de data solta) ── */
var pdt=function(s){return new Date(s+'T00:00:00Z')};
var iso=function(d){return d.toISOString().slice(0,10)};
var addDays=function(s,n){var d=pdt(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
var dm=function(s){return s?s.slice(8,10)+'/'+s.slice(5,7):''};
function dmax(){
  if(D.meta.data_ate)return D.meta.data_ate;
  var m='';['anuncios','leads','vendas'].forEach(function(k){(D[k]||[]).forEach(function(r){if(r.d>m)m=r.d})});
  return m||iso(new Date());
}
function range(){
  if(S.per==='all')return ['0000-00-00','9999-99-99'];
  if(S.per==='custom')return [S.from||'0000-00-00',S.to||'9999-99-99'];
  var e=dmax(),n=+S.per;return [addDays(e,-(n-1)),e];
}
function inR(d){var r=range();return d>=r[0]&&d<=r[1]}
function bucket(d){
  if(S.gran==='d')return d;
  if(S.gran==='m')return d.slice(0,7);
  var x=pdt(d),wd=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-wd);return iso(x);
}
function bLabel(b){return S.gran==='m'?b.slice(5,7)+'/'+b.slice(2,4):dm(b)}

/* ── metas (cores verde/amarelo/vermelho) ── */
var METAS_DEF={ctr:[1,.8],connect_rate:[71,63],tx_ic:[15,12],tx_checkout:[25,20],tx_conv:[7,5],cpm:[40,60],cpa:[14,21],cpl:[20,30],cpc:[1.5,2.5],roas:[.69,.5]};
var LOWER={cpm:1,cpa:1,cpl:1,cpc:1};
function cls(m,v){
  if(!ok(v))return '';
  var mt=(D.config.metas&&D.config.metas[m])||METAS_DEF[m];if(!mt)return '';
  if(LOWER[m])return v<=mt[0]?'good':v<=mt[1]?'mid':'bad';
  return v>=mt[0]?'good':v>=mt[1]?'mid':'bad';
}

/* ── modo e acesso aos dados filtrados ── */
var MODO=function(){return D.config.modo==='leads'?'leads':'vendas'};
function isL(c){var k=D.meta.lancamento_cod;return !k||String(c||'').toLowerCase().indexOf(k.toLowerCase())>-1}
function campOk(r){return (!S.onlyL||isL(r.c))&&(!S.camps||S.camps.has(r.c))}
function adsR(){return (D.anuncios||[]).filter(function(r){return inR(r.d)&&campOk(r)})}
function segR(k){return ((D.segmentos||{})[k]||[]).filter(function(r){return inR(r.d)&&campOk(r)})}
function leadsR(){return (D.leads||[]).filter(function(r){return inR(r.d)})}
function isUp(p){var x=(D.produtos||[]).filter(function(q){return q.nome===p})[0];return !!(x&&x.upsell)}
function vendasP(){return (D.vendas||[]).filter(function(r){return inR(r.d)&&(!S.paid||r.org==='Pago')})}
function vendasMain(){return vendasP().filter(function(r){return !isUp(r.p)})}
function vendasUp(){return vendasP().filter(function(r){return isUp(r.p)})}
function allCamps(){var s={};(D.anuncios||[]).forEach(function(r){if(!S.onlyL||isL(r.c))s[r.c]=1});return Object.keys(s).sort()}

/* casa nomes de UTM (podem vir truncados) com nomes de campanha/conjunto/anúncio */
function mk_(a,b){
  a=String(a||'').trim().toLowerCase();b=String(b||'').trim().toLowerCase();
  if(!a||!b)return false;if(a===b)return true;
  return a.length>=20&&b.length>=20&&(a.indexOf(b)===0||b.indexOf(a)===0);
}

/* ── derivação de métricas a partir de totais ── */
function derive(o){
  var leads=o.leads||0,vendas=o.vendas||0,compras=(D.config.compras_fonte==='vendas_pagas')?(o.vp||0):(o.pur||0);
  var md=MODO()==='leads';
  return {
    ctr:pc(o.lc,o.imp),cr:pc(o.pv,o.lc),tx_ic:pc(o.ic,o.pv),tx_checkout:pc(compras,o.ic),
    tx_conv:md?pc(leads,o.pv):pc(compras,o.pv),
    cpm:o.imp>0?o.sp/o.imp*1000:null,cpc:div(o.sp,o.lc),cpl:div(o.sp,leads),cpa:div(o.sp,vendas),
    roas:div(o.fat||0,o.sp),compras:compras
  };
}
function K(){
  var A=adsR(),L=leadsR(),VM=vendasMain(),VU=vendasUp();
  var o={sp:sum(A,'sp'),imp:sum(A,'imp'),lc:sum(A,'lc'),pv:sum(A,'pv'),ic:sum(A,'ic'),pur:sum(A,'pur'),
    leads:sum(L,'n'),vendas:VM.length,vp:VM.filter(function(r){return r.org==='Pago'}).length,
    fatM:sum(VM,'v'),fatU:sum(VU,'v')};
  o.fat=o.fatM+o.fatU;o.res=MODO()==='leads'?o.leads:o.vendas;
  var d=derive(o);for(var k in d)o[k]=d[k];
  var days={};A.forEach(function(r){if(r.sp>0)days[r.d]=1});o.dias=Object.keys(days).length;
  return o;
}
/* série por balde (dia/semana/mês) */
function series(){
  var m={};function g(b){return m[b]||(m[b]={sp:0,imp:0,lc:0,pv:0,ic:0,pur:0,leads:0,vendas:0,vp:0,fat:0})}
  adsR().forEach(function(r){var o=g(bucket(r.d));o.sp+=r.sp||0;o.imp+=r.imp||0;o.lc+=r.lc||0;o.pv+=r.pv||0;o.ic+=r.ic||0;o.pur+=r.pur||0});
  leadsR().forEach(function(r){g(bucket(r.d)).leads+=r.n||0});
  vendasMain().forEach(function(r){var o=g(bucket(r.d));o.vendas++;o.fat+=r.v||0;if(r.org==='Pago')o.vp++});
  vendasUp().forEach(function(r){g(bucket(r.d)).fat+=r.v||0});
  var keys=Object.keys(m).sort();
  return {keys:keys,rows:keys.map(function(k){var o=m[k];var d=derive(o);for(var x in d)o[x]=d[x];o.res=MODO()==='leads'?o.leads:o.vendas;return o})};
}

/* ── gráficos ── */
function killCharts(){CH.forEach(function(c){try{c.destroy()}catch(e){}});CH=[]}
function mkc(id,cfg){var el=document.getElementById(id);if(!el)return null;var c=new Chart(el,cfg);CH.push(c);return c}
var ink=function(){return S.theme==='dark'?'#8b8fa8':'#6b6f85'};
var gridc=function(){return S.theme==='dark'?'rgba(255,255,255,.07)':'rgba(0,0,0,.06)'};
var DL=function(o){return Object.assign({display:function(c){return S.labels&&c.chart.data.labels.length<=16},font:{size:10,weight:'700'}},o)};
var PAL=['#3b82f6','#60a5fa','#1d4ed8','#93c5fd','#1e40af','#bfdbfe','#0ea5e9','#6366f1','#a5b4fc','#38bdf8'];
function baseScales(extra){
  var s={x:{ticks:{color:ink(),font:{size:10},maxRotation:0,autoSkipPadding:8},grid:{display:false}},
         y:{beginAtZero:true,ticks:{color:ink(),font:{size:10}},grid:{color:gridc()}}};
  for(var k in (extra||{}))s[k]=extra[k];return s;
}

/* ── componentes de HTML ── */
function kpi(l,v,s,c){return '<div class="kpi '+(c||'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'}
function card(h,sub,body,x){return '<div class="card '+(x||'')+'">'+(h?'<h2>'+h+'</h2>':'')+(sub?'<div class="sub">'+sub+'</div>':'')+body+'</div>'}
function head(h,sub,right){return '<div class="hd"><div>'+(h?'<h2>'+h+'</h2>':'')+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+(right||'')+'</div>'}
function tbl(cols,rows){
  return '<div class="tw"><table><thead><tr>'+cols.map(function(c){return '<th class="'+(c[1]||'n')+'">'+c[0]+'</th>'}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function td(v,c,al){return '<td class="'+(al||'n')+(c?' '+c:'')+'">'+v+'</td>'}
function tdt(v,c){return td(v,c,'t')}
function granSeg(){
  return '<div class="seg dk">'+[['d','gDia'],['w','gSem'],['m','gMes']].map(function(g){return '<button data-act="gran" data-v="'+g[0]+'" class="'+(S.gran===g[0]?'on':'')+'">'+t(g[1])+'</button>'}).join('')+'</div>';
}
function campDD(){
  var cs=allCamps();if(!cs.length)return '';
  var all=!S.camps;
  return '<details class="dd" style="margin-bottom:12px"><summary>'+t('campanhas')+(all?'':' ('+S.camps.size+')')+' ▾</summary><div class="pn">'+
    '<label><input type="checkbox" data-act="camp-all" '+(all?'checked':'')+'> <b>'+t('todas')+'</b></label>'+
    cs.map(function(c){return '<label><input type="checkbox" data-act="camp" data-v="'+esc(c)+'" '+((all||S.camps.has(c))?'checked':'')+'> '+esc(c)+'</label>'}).join('')+
  '</div></details>';
}
function nolaunch(){return '<div class="empty">'+t('semDados')+'</div>'}
function post(f){POST.push(f)}
/* ════════════════════════════════════════════════════════════════════
   PÁGINAS A: Captação / Meta Ads
   Cada página devolve HTML e agenda gráficos com post(fn).
   ════════════════════════════════════════════════════════════════════ */
var PAGE={};
var HOTRE=/(^|[^a-z])(hot|quente|caliente)([^a-z]|$)/i, COLDRE=/(^|[^a-z])(cold|frio|fr[ií]o)([^a-z]|$)/i;
function tipoDe(){ // HOT | COLD | OUTRO a partir de textos (conjunto, campanha, utm...)
  for(var i=0;i<arguments.length;i++){var s=arguments[i]||'';if(HOTRE.test(s))return 'HOT';if(COLDRE.test(s))return 'COLD'}
  return 'OUTRO';
}
function fonte(){return D.meta.fonte_label||'Hotmart'}

/* ── funil ── */
function funnelHtml(k){
  var md=MODO()==='leads';
  var steps=md?[['impressoes',k.imp,'#3b82f6','#fff'],['cliques',k.lc,'#5b9bf7','#fff'],['pv',k.pv,'#8ab6fa','#0b1b3a'],['leads',k.leads,'#0f9d6b','#fff']]
              :[['impressoes',k.imp,'#3b82f6','#fff'],['cliques',k.lc,'#5b9bf7','#fff'],['pv',k.pv,'#8ab6fa','#0b1b3a'],['initCk',k.ic,'#b7d0fb','#0b1b3a'],['compras',k.compras,'#0f9d6b','#fff']];
  var W=md?[100,88,74,34]:[100,88,78,32,16];
  var rates=md?[['ctr',k.ctr,'CTR'],['connect_rate',k.cr,'Connect Rate'],['tx_conv',k.tx_conv,t('txConvLead')]]
              :[['ctr',k.ctr,'CTR'],['connect_rate',k.cr,'Connect Rate'],['tx_ic',k.tx_ic,t('txInit')],['tx_checkout',k.tx_checkout,t('txCheckout')]];
  var h='<div class="fn">';
  steps.forEach(function(s,i){
    h+='<div class="fb" style="width:'+W[i]+'%;background:'+s[2]+';color:'+s[3]+'"><span>'+t(s[0])+'</span><span>'+num(s[1])+'</span></div>';
    if(rates[i]){var c=cls(rates[i][0],rates[i][1]);h+='<div class="fr"><span class="'+(c||'mut')+'">'+(c==='bad'||c==='mid'?'↓':'↓')+'</span><span class="rate '+c+'">'+pct(rates[i][1])+' '+rates[i][2]+'</span></div>'}
  });
  h+='</div>';
  if(!md){var c2=cls('tx_conv',k.tx_conv);h+='<div class="fconv '+c2+'">'+t('txConvPv')+' <b class="'+c2+'">'+pct(k.tx_conv)+'</b></div>'}
  return h;
}

/* ── gráfico diário combinado ── */
function dailyCard(){
  var s=series(),md=MODO()==='leads',lab=s.keys.map(bLabel);
  var cpaMax=Math.max.apply(null,s.rows.map(function(r){return (md?r.cpl:r.cpa)||0}).concat([1]))*2.2;
  var title=md?t('leadsDiarios'):t('vendasDiarias');
  var h=card(null,null,head(title,t(md?'subDailyL':'subDailyV'),granSeg())+'<div class="ch lg"><canvas id="cDaily"></canvas></div>');
  post(function(){
    mkc('cDaily',{type:'bar',data:{labels:lab,datasets:[
      {type:'bar',label:md?t('leads'):t('vendas'),data:s.rows.map(function(r){return r.res}),backgroundColor:md?'#4d9ff5':'#fb923c',borderRadius:4,yAxisID:'y',order:3,
        datalabels:DL({anchor:'end',align:'end',color:md?'#2563eb':'#ea580c',formatter:function(v){return v>0?v:''}})},
      {type:'line',label:t('invers'),data:s.rows.map(function(r){return r.sp}),borderColor:'#10a37f',backgroundColor:'#10a37f',tension:.35,pointRadius:3,yAxisID:'y2',order:1,
        datalabels:DL({align:'top',color:'#0b7a53',formatter:function(v){return v>0?cur()+nf(v,0):''}})},
      {type:'line',label:md?'CPL':'CPA',data:s.rows.map(function(r){return md?r.cpl:r.cpa}),borderColor:S.theme==='dark'?'#e5e7eb':'#111827',borderDash:[5,4],tension:.35,pointRadius:2,yAxisID:'y3',spanGaps:true,order:2,
        datalabels:DL({align:'bottom',color:S.theme==='dark'?'#e5e7eb':'#111827',formatter:function(v){return v?cur()+nf(v,0):''}})}
    ]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:22}},
      plugins:{legend:{position:'top',labels:{boxWidth:10,color:ink(),font:{size:10}}},
        tooltip:{callbacks:{label:function(c){var v=c.raw;return c.dataset.label+': '+(c.datasetIndex===0?num(v):money(v))}}}},
      scales:baseScales({y2:{position:'right',beginAtZero:true,grid:{display:false},ticks:{color:ink(),font:{size:10},callback:function(v){return cur()+v}}},y3:{display:false,min:0,max:cpaMax}})}});
  });
  return h;
}

/* ── pizza genérica ── */
function pieCard(id,title,sub,labels,values,colors,type){
  var tot=values.reduce(function(a,b){return a+b},0);
  var h=card(title,sub,tot>0?'<div class="ch"><canvas id="'+id+'"></canvas></div>':'<div class="empty">'+t('semDados')+'</div>');
  if(tot>0)post(function(){
    mkc(id,{type:type||'doughnut',data:{labels:labels,datasets:[{data:values,backgroundColor:colors,borderWidth:2,borderColor:S.theme==='dark'?'#16171f':'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:type==='pie'?0:'55%',
        plugins:{legend:{position:'bottom',labels:{boxWidth:10,color:ink(),font:{size:10}}},
          datalabels:DL({color:'#fff',formatter:function(v){return v>0?num(v)+'\n'+nf(v/tot*100,0)+'%':''},textAlign:'center'})}}});
  });
  return h;
}

/* ── tabelas de vendas por UTM ── */
function blank(v){return v?esc(v):'<span class="mut">'+t('vazio')+'</span>'}
function sckBox(title,field,adField,opts){
  opts=opts||{};
  var rows=vendasMain(),g={};
  rows.forEach(function(r){var k=r[field]||'';var o=g[k]||(g[k]={n:0,f:0});o.n++;o.f+=r.v||0});
  var A=adsR(),withInv=!!adField;
  var list=Object.keys(g).map(function(k){var o=g[k];o.k=k;if(withInv&&k)o.sp=sum(A.filter(function(a){return mk_(k,a[adField])}),'sp');return o})
    .sort(function(a,b){return b.n-a.n}).slice(0,12);
  var cols=[[t('valor'),'t']];if(withInv)cols.push([t('invers')]);cols.push([t('vendas')],[t('fact')]);if(withInv)cols.push(['CPA']);
  var body=list.map(function(o){
    var tag=(opts.tag&&o.k&&opts.tag(o.k))?'<span class="tag pgo">'+t('leadPago')+'</span>':'';
    var c=withInv&&o.sp?o.sp/o.n:null;
    return '<tr>'+tdt(blank(o.k)+tag)+(withInv?td(o.sp?money(o.sp):'—'):'')+td(num(o.n))+td(money(o.f),'good')+(withInv?td(ok(c)?money(c):'—',cls('cpa',c)):'')+'</tr>';
  }).join('');
  return '<div class="box"><h3>'+title+'</h3>'+(list.length?tbl(cols,body):'<div class="empty">'+t('semDados')+'</div>')+'</div>';
}

/* ── página: Captação ── */
PAGE.captacao=function(){
  var k=K(),md=MODO()==='leads',h='';
  if(md){
    h+='<div class="kpis">'+kpi(t('invest'),money(k.sp),t('metaAds'),'dark')+
      kpi('CPL',money(k.cpl),t('custoLead'),cls('cpl',k.cpl)||'green')+
      kpi(t('leads'),num(k.leads),num(k.dias)+' '+t('diasAtivos'),'blue')+
      kpi(t('txConvLead'),pct(k.tx_conv),t('leadsSobrePv'),cls('tx_conv',k.tx_conv)||'orange')+'</div>';
  }else{
    h+='<div class="kpis">'+kpi(t('invest'),money(k.sp),t('metaAds'),'dark')+
      kpi(t('fatTotal'),money(k.fat),fonte(),'green')+
      kpi('ROAS',xf(k.roas),fonte()+' / '+t('invers'),cls('roas',k.roas)||'orange')+
      kpi(t('vendas'),num(k.vendas),fonte(),'dark')+
      kpi('CAC',money(k.cpa),t('invers')+' / '+t('vendas').toLowerCase()+' '+fonte(),cls('cpa',k.cpa)||'bad')+
      kpi(t('fatUp'),money(k.fatU),pct(pc(k.fatU,k.fat),1)+' '+t('doTotal'),'orange')+'</div>';
  }
  // HOT x COLD (modo leads): cards; (modo vendas): pizza
  if(md){
    var T={HOT:{l:0,sp:0},COLD:{l:0,sp:0}};
    leadsR().forEach(function(r){var x=T[r.t];if(x)x.l+=r.n||0});
    adsR().forEach(function(r){var x=T[tipoDe(r.a,r.c)];if(x)x.sp+=r.sp||0});
    h+='<div class="grid2e">'+['HOT','COLD'].map(function(q){var o=T[q];
      return card(t(q==='HOT'?'quente':'frio'),null,'<div class="tw"><table><tbody>'+
        '<tr>'+tdt(t('leads'))+td(num(o.l))+'</tr><tr>'+tdt(t('orcamento'))+td(money(o.sp))+'</tr><tr>'+tdt('CPL')+td(money(div(o.sp,o.l)),cls('cpl',div(o.sp,o.l)))+'</tr></tbody></table></div>')}).join('')+'</div>';
  }
  h+=card(D.config.funil_titulo||t('funilTit'),null,funnelHtml(k));
  var dc=dailyCard();
  if(!md&&D.config.usar_origem!==false){
    var VM=vendasMain(),pg=VM.filter(function(r){return r.org==='Pago'}).length,og=VM.length-pg;
    h+='<div class="grid2">'+dc+pieCard('cOrg',t('vendasOrigem'),null,[t('pago'),t('organico')],[pg,og],['#f97316','#cbd5e1'])+'</div>';
  }else h+=dc;

  if(!md){
    // vendas por produto
    var VP=vendasP(),gp={};
    VP.forEach(function(r){var o=gp[r.p]||(gp[r.p]={p:r.p,pg:0,og:0,f:0});if(r.org==='Pago')o.pg++;else o.og++;o.f+=r.v||0});
    var pr=Object.keys(gp).map(function(x){return gp[x]}).sort(function(a,b){return b.f-a.f});
    var tp=pr.reduce(function(a,o){a.pg+=o.pg;a.og+=o.og;a.f+=o.f;return a},{pg:0,og:0,f:0});

/* Comparativo: todos os lançamentos com debriefing lado a lado (carrega sob demanda, guarda em DBC) */
function dbCmp(){
  var Ls=LAUNCHES.filter(function(L){return L.debriefing});
  if(!Ls.length||(Ls.length===1&&Ls[0].id===S.launch))return '';
  var falta=Ls.filter(function(L){return DBC[L.id]===undefined});
  if(falta.length){
    post(function(){Promise.all(falta.map(function(L){return fetch('./'+L.debriefing+'?t='+Date.now()).then(function(r){return r.ok?r.json():null}).catch(function(){return null}).then(function(j){DBC[L.id]=j})}))
      .then(function(){var el=$('#dbCmp');if(el&&S.page==='debriefing')el.outerHTML=dbCmp()})});
    return '<div id="dbCmp">'+card(t('dbComparativo'),null,'<div class="load" style="height:80px">'+t('carregando')+'</div>')+'</div>';
  }
  var rows=Ls.filter(function(L){return DBC[L.id]}).map(function(L){return [L,DBC[L.id].metricas_gerais||{}]});
  function best(f,min){var v=rows.map(function(r){return r[1][f]}).filter(ok);return v.length>1?(min?Math.min:Math.max).apply(null,v):null}
  var b={cpl:best('cpl',1),cac:best('cac',1),tasa_conversion:best('tasa_conversion'),roas:best('roas')};
  function c(f,v){return b[f]!=null&&v===b[f]?'good':''}
  var body=rows.map(function(x){var L=x[0],m=x[1],cur=L.id===S.launch;
    return '<tr class="lk'+(cur?' cur':'')+'" data-act="launch" data-v="'+esc(L.id)+'" title="'+t('dbCmpAbrir')+'">'+tdt(esc(L.label||L.id)+(cur?' <span class="tg org">'+t('dbAberto')+'</span>':''))+
      td(money(m.inversion_total))+td(num(m.leads))+td(money(m.cpl),c('cpl',m.cpl))+td(num(m.total_ventas))+td(money(m.cac),c('cac',m.cac))+td(fr(m.tasa_conversion),c('tasa_conversion',m.tasa_conversion))+td(money(m.facturacion))+td(xf(m.roas),c('roas',m.roas))+'</tr>'}).join('');
  return '<div id="dbCmp">'+card(t('dbComparativo'),t('dbCmpSub'),tbl([[t('lancamento'),'t'],[t('invers')],[t('leads')],['CPL'],[t('vendas')],['CAC'],[t('dbTxConv')],[t('fact')],['ROAS']],body))+'</div>';
}

    if(MODO()==='vendas'&&p!=='general')h+='<div class="seg"><button data-act="paid" class="'+(S.paid?'on':'')+'">'+t('trafPago')+'</button></div>';
  }
  h+='<div class="seg"><button data-act="lang" data-v="pt" class="'+(S.lang==='pt'?'on':'')+'">PT</button><button data-act="lang" data-v="es" class="'+(S.lang==='es'?'on':'')+'">ES</button></div>';
  h+='<div class="seg dk"><button data-act="labels" class="'+(S.labels?'on':'')+'">'+t('etiquetas')+'</button></div>';
  h+='<div class="seg"><button data-act="theme">'+(S.theme==='dark'?'☀ '+t('claro'):'☾ '+t('escuro'))+'</button></div>';
  return h;
}
function chrome(){
  var m=D.meta;
  $('#sbLogo').textContent=m.letra||(m.cliente||'FT').slice(0,2).toUpperCase();
  $('#sbName').textContent=m.cliente||'';$('#sbSub').textContent=t('lancamento');
  $('#sbLl').textContent=t('lancamento');$('#sbLaunch').textContent=m.evento||m.lancamento_cod||'—';
  $('#sbUpd').textContent=t('atualizado')+' '+(m.atualizado_em||'');
  $('#pgTitle').textContent=t(NAV[S.page][1]);
  $('#pillUp').textContent=D.semDados?'● '+((DB&&DB.status)||t('navDb')):'● '+t('dadosAte')+' '+dm(dmax());
  $('#nav').innerHTML=pagesOn().map(function(p){return '<button class="nav-i '+(p===S.page?'on':'')+'" data-act="nav" data-v="'+p+'"><span class="ic">'+NAV[p][0]+'</span>'+t(NAV[p][1])+'</button>'}).join('');
  $('#filters').innerHTML=filtersHtml();
  var lb=$('#launchbar');
  if(LAUNCHES.length>1){
    lb.style.display='';
    lb.innerHTML='<span class="lbl">'+t('lancamento')+'</span>'+LAUNCHES.map(function(L){return '<button class="lb '+(L.id===S.launch?'on':'')+'" data-act="launch" data-v="'+esc(L.id)+'">'+(L.live?'<span class="live"></span>':'')+esc(L.label||L.id)+'</button>'}).join('');
  }else lb.style.display='none';
}
function render(){
  if(!D)return;
  var open=!!$('.dd[open]');
  killCharts();POST=[];
  if(pagesOn().indexOf(S.page)<0)S.page=pagesOn()[0];
  chrome();
  var html;try{html=PAGE[S.page]()}catch(e){console.error(e);html='<div class="empty">Erro ao montar a página: '+esc(e.message)+'</div>'}
  $('#page').innerHTML=html;
  POST.forEach(function(f){try{f()}catch(e){console.error(e)}});
  var dd=$('.dd');if(dd&&open)dd.setAttribute('open','');
  try{history.replaceState(null,'','#'+S.launch+'/'+S.page)}catch(e){}
}

/* ── eventos (delegação) ── */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  switch(a){
    case 'nav':S.page=v;window.scrollTo(0,0);break;
    case 'launch':loadLaunch(v,S.page);return;
    case 'per':S.per=v;S.from=S.to='';break;
    case 'clr':S.per='all';S.from=S.to='';break;
    case 'onlyL':S.onlyL=v==='1';S.camps=null;break;
    case 'paid':S.paid=!S.paid;break;
    case 'lang':S.lang=v;lsSet('ft_lang',v);break;
    case 'labels':S.labels=!S.labels;lsSet('ft_labels',S.labels?'1':'0');break;
    case 'theme':S.theme=S.theme==='dark'?'light':'dark';lsSet('ft_theme',S.theme);applyTheme();break;
    case 'gran':S.gran=v;break;
    case 'pais':PAISSEL=v;break;
    case 'exp':document.querySelectorAll('tr[data-p="'+v+'"]').forEach(function(r){r.style.display=r.style.display==='none'?'':'none'});return;
    case 'scf':SC.f=v;SC.p=1;break;
    case 'scs':if(SC.s===v)SC.asc=!SC.asc;else{SC.s=v;SC.asc=false}SC.p=1;scTable();return;
    case 'scp':SC.p=+v;scTable();return;
    default:return;
  }
  render();
});
document.addEventListener('change',function(e){
  var el=e.target,a=el.getAttribute&&el.getAttribute('data-act');if(!a)return;
  if(a==='camp-all'){S.camps=null}
  else if(a==='camp'){var v=el.getAttribute('data-v'),all=allCamps();if(!S.camps)S.camps=new Set(all);
    if(S.camps.has(v))S.camps.delete(v);else S.camps.add(v);if(S.camps.size===0||S.camps.size===all.length)S.camps=null}
  else if(a==='dfrom'){S.from=el.value;S.per='custom'}
  else if(a==='dto'){S.to=el.value;S.per='custom'}
  else if(a==='psq'){PSQ.f=el.value}
  else return;
  render();
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='fsz'){document.documentElement.style.setProperty('--fs',el.value+'px');return}
  if(el.getAttribute&&el.getAttribute('data-act')==='scq'){SC.q=el.value;SC.p=1;scTable()}
});
window.addEventListener('hashchange',function(){
  var h=(location.hash||'').replace('#','').split('/');
  if(h[0]&&h[0]!==S.launch)loadLaunch(h[0],h[1]);else if(h[1]&&h[1]!==S.page&&pagesOn().indexOf(h[1])>-1){S.page=h[1];render()}
});

/* ── carregamento ── */
function showErr(msg){$('#page').innerHTML='<div class="empty" style="color:var(--bad)">'+esc(msg)+'</div>'}
function loadLaunch(id,page){
  var L=LAUNCHES.filter(function(x){return x.id===id})[0]||LAUNCHES[0];
  if(!L){showErr('launches.json sem lançamentos');return}
  $('#page').innerHTML='<div class="load">'+t('carregando')+'</div>';
  var pD=L.file?fetch('./'+L.file+'?t='+Date.now()).then(function(r){if(!r.ok)throw new Error(L.file+': HTTP '+r.status);return r.json()}):Promise.resolve(null);
  var pB=L.debriefing?fetch('./'+L.debriefing+'?t='+Date.now()).then(function(r){return r.ok?r.json():null}).catch(function(){return null}):Promise.resolve(null);
  Promise.all([pD,pB]).then(function(res){
    var j=res[0],prev=(D&&D.meta)||{};DB=res[1];
    if(!j){ // lançamento encerrado só com debriefing: marca vem do launches.json (ou do lançamento aberto antes)
      if(!DB)throw new Error((L.debriefing||'debriefing')+' não encontrado');
      j={semDados:true,config:{paginas:['debriefing']},meta:{cliente:L.cliente||prev.cliente||'',letra:L.letra||prev.letra,cor:L.cor||prev.cor,moeda:L.moeda||prev.moeda||'€',
        idioma_padrao:L.idioma_padrao||prev.idioma_padrao,evento:L.evento||L.label||'',atualizado_em:DB.atualizado_em||''}};
    }
    D=j;D.meta=D.meta||{};D.config=D.config||{};S.launch=L.id;
    S.per='all';S.from=S.to='';S.camps=null;S.paid=false;S.onlyL=true;S.gran='d';PAISSEL=null;PSQ.f='';SC.f='all';SC.q='';SC.p=1;SC.s='ideal';SC.asc=false;
    S.lang=lsGet('ft_lang')||D.meta.idioma_padrao||'pt';
    applyBrand();applyTheme();
    S.page=(page&&pagesOn().indexOf(page)>-1)?page:pagesOn()[0];
    render();
  }).catch(function(e){showErr('Erro ao carregar '+(L.label||L.id)+': '+e.message);console.error(e)});
}
function boot(){
  S.theme=lsGet('ft_theme')==='dark'?'dark':'light';S.labels=lsGet('ft_labels')!=='0';S.lang=lsGet('ft_lang')||'pt';applyTheme();
  Chart.register(ChartDataLabels);Chart.defaults.plugins.datalabels.display=false;Chart.defaults.font.family="Inter,system-ui,sans-serif";
  fetch('./launches.json?t='+Date.now()).then(function(r){if(!r.ok)throw new Error('sem launches.json');return r.json()})
  .then(function(j){LAUNCHES=j.lancamentos||j}).catch(function(){LAUNCHES=[{id:'atual',label:'',file:'data.json'}]})
  .then(function(){var h=(location.hash||'').replace('#','').split('/');loadLaunch(h[0],h[1])});
}
boot();
</script>
