# Atualização automática do dashboard Fortraffic (modo GitHub Actions, recomendado).
# Copie para .github/workflows/atualizar-dashboard.yml no repositório do cliente e troque os <...>.
# Pré-requisitos (uma vez por repositório), ver references/github-actions.md:
#   Secrets:   META_ACCESS_TOKEN, GOOGLE_SA_JSON
#   Variables: META_AD_ACCOUNT_ID, META_SINCE, SHEETS
#   Settings → Pages → Source: "GitHub Actions"
name: Atualizar dashboard

on:
  schedule:
    - cron: "17 * * * *"        # de hora em hora (minuto 17: evita a fila do minuto 0; o GitHub pode atrasar alguns minutos)
  workflow_dispatch: {}          # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]
    paths: ["docs/**"]           # publica também quando a Rotina diária ou alguém sobe arquivo em docs/

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      LANCAMENTO: plf-oct26
      GERADOR: rotina/gerar_data_plf_oct26.py
    steps:
      - uses: actions/checkout@v4

      - name: Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar data JSON
        if: github.event_name != 'push'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          META_AD_ACCOUNT_ID: ${{ vars.META_AD_ACCOUNT_ID }}
          META_SINCE: ${{ vars.META_SINCE }}
          SHEETS: ${{ vars.SHEETS }}
          DATA_URL: https://brenofergon.github.io/dashboard-familias-plfago2026/data-${{ env.LANCAMENTO }}.json
          TZ: America/Sao_Paulo
        run: |
          pip install -q pandas openpyxl requests google-auth
          python rotina/coletar_fontes.py
          python "$GERADOR"
          python rotina/validate_data.py "/tmp/data-$LANCAMENTO.json"
          cp "/tmp/data-$LANCAMENTO.json" "docs/data-$LANCAMENTO.json"

      - name: Salvar no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "ft-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/data-$LANCAMENTO.json"
          git diff --cached --quiet && { echo "sem mudanças"; exit 0; }
          git commit -q -m "Dashboard $LANCAMENTO $(date +'%d/%m/%Y %H:%M')"
          git pull -q --rebase origin main && git push -q origin HEAD:main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
